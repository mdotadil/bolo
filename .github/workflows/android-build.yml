# Android build workflow for Bolo.
#
# Builds a signed release APK when the repo has release-signing secrets
# configured, otherwise falls back to a debug-signed APK so the pipeline
# always produces something installable.
#
# ---------------------------------------------------------------------------
# ONE-TIME SETUP: repo secrets for signed release builds
# ---------------------------------------------------------------------------
# Add these secrets under GitHub repo Settings > Secrets and variables >
# Actions > New repository secret. Without them this workflow still runs
# fine, it just builds a debug-signed APK instead.
#
#   KEYSTORE_BASE64    Base64-encoded contents of the release keystore.
#                       Produce it locally from the keystore that already
#                       lives outside this repo:
#                         base64 -i ~/keys/bolo-release.keystore | pbcopy
#                       Then paste the clipboard contents as the secret value.
#
#   KEYSTORE_PASSWORD  Same password used for both the keystore (store
#                       password) and the release key (key password) — this
#                       keystore was created with matching passwords. Read it
#                       from the macOS keychain:
#                         security find-generic-password -a bolo -s bolo-release-keystore -w
#
#   KEY_ALIAS          Optional. The signing key alias. Defaults to "bolo"
#                       if the secret is not set (that is the alias the
#                       local keystore was created with).
#
# Do NOT paste actual secret values into this file or into commit messages.
# ---------------------------------------------------------------------------

name: Android Build

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Check for release signing secrets
        id: signing_check
        env:
          HAS_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
        run: |
          echo "has_secrets=$HAS_SECRETS" >> "$GITHUB_OUTPUT"
          if [ "$HAS_SECRETS" = "true" ]; then
            echo "Release signing secrets found — will build a signed release APK."
          else
            echo "Release signing secrets NOT configured — will build a debug-signed APK instead."
          fi

      - name: Set up release signing
        if: steps.signing_check.outputs.has_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/bolo-release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-bolo}
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Build release APK (signed)
        if: steps.signing_check.outputs.has_secrets == 'true'
        run: |
          echo "Building signed release APK."
          flutter build apk --release

      - name: Build debug APK (debug-signed fallback)
        if: steps.signing_check.outputs.has_secrets != 'true'
        run: |
          echo "Building debug-signed APK (no release signing secrets configured)."
          flutter build apk --debug

      - name: Upload release APK
        if: steps.signing_check.outputs.has_secrets == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug APK
        if: steps.signing_check.outputs.has_secrets != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

  # Store-channel proof + AAB. The `build` job above is the sideload family
  # pipeline and stays unchanged; the guard tests ride its `flutter test`.
  store-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Store-channel widget proof
        run: flutter test --dart-define=BOLO_CHANNEL=store test/features/channel_test.dart

      - name: Check for release signing secrets
        id: signing_check
        env:
          HAS_SECRETS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_PASSWORD != '' }}
        run: echo "has_secrets=$HAS_SECRETS" >> "$GITHUB_OUTPUT"

      - name: Set up release signing
        if: steps.signing_check.outputs.has_secrets == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/bolo-release.keystore"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEYSTORE_PASSWORD
          keyAlias=${KEY_ALIAS:-bolo}
          storeFile=$KEYSTORE_PATH
          EOF

      - name: Build store AAB (release)
        if: steps.signing_check.outputs.has_secrets == 'true'
        run: flutter build appbundle --release --dart-define=BOLO_CHANNEL=store

      - name: Build store AAB (debug fallback)
        if: steps.signing_check.outputs.has_secrets != 'true'
        run: flutter build appbundle --debug --dart-define=BOLO_CHANNEL=store

      - name: Upload store AAB
        uses: actions/upload-artifact@v4
        with:
          name: bolo-store-aab
          path: build/app/outputs/bundle/*/app-*.aab
          retention-days: 30
